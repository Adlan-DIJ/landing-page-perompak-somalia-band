<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perompak Somalia - Band Experimental Surf Rock asal Depok | Single Perdana "HASRAT" Out Now</title>
  <meta name="description" content="Perompak Somalia, band Experimental Surf Rock asal Depok, baru saja merilis single perdana HASRAT di berbagai layanan streaming musik digital — dentuman ombak reverb dan badai fuzz dengan lirik penuh makna.">
  <link rel="icon" type="image/jpeg" href="Assets/Image/logo_black.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/css/output.css?v=2">
</head>
<body class="noise-bg">

  <!-- Partials akan dimuat ke slot berikut -->
  <div data-include="navbar"></div>
  <div data-include="hero"></div>
  <div data-include="about"></div>
  <div data-include="featured"></div>
  <div data-include="gallery"></div>
  <div data-include="artists"></div>
  <div data-include="events"></div>
  <div data-include="contact"></div>
  <div data-include="footer"></div>

  <!-- ===== SCRIPTS ===== -->
  <script>
    // --- Partial Loader ---
    async function loadPartials() {
      const slots = document.querySelectorAll('[data-include]');
      await Promise.all(Array.from(slots).map(async (slot) => {
        const name = slot.getAttribute('data-include');
        const res = await fetch('partials/' + name + '.html');
        if (!res.ok) throw new Error('Gagal memuat partial: ' + name);
        slot.outerHTML = await res.text();
      }));
    }

    function initSite() {
      // --- Mobile Drawer ---
      const menuToggle = document.getElementById('menuToggle');
      const mobileMenu = document.getElementById('mobileMenu');
      const drawerBackdrop = document.getElementById('drawerBackdrop');
      const drawerClose = document.getElementById('drawerClose');
      let menuOpen = false;

      function setDrawer(open) {
        menuOpen = open;
        mobileMenu.classList.toggle('translate-x-full', !open);
        drawerBackdrop.classList.toggle('opacity-0', !open);
        drawerBackdrop.classList.toggle('pointer-events-none', !open);
        document.body.style.overflow = open ? 'hidden' : '';
      }

      menuToggle.addEventListener('click', () => setDrawer(true));
      drawerClose.addEventListener('click', () => setDrawer(false));
      drawerBackdrop.addEventListener('click', () => setDrawer(false));

      // Tutup drawer saat link menu diklik (sebelum smooth scroll)
      document.querySelectorAll('.mobile-link').forEach((link) => {
        link.addEventListener('click', () => setDrawer(false));
      });

      // --- Smooth scroll ---
      document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
        anchor.addEventListener('click', function (e) {
          e.preventDefault();
          const target = document.querySelector(this.getAttribute('href'));
          if (target) {
            target.scrollIntoView({ behavior: 'smooth' });
          }
        });
      });

      // --- Hero carousel ---
      const heroSlides = document.querySelectorAll('.hero-slide');
      if (heroSlides.length > 1) {
        let currentSlide = 0;
        setInterval(() => {
          heroSlides[currentSlide].classList.remove('active');
          currentSlide = (currentSlide + 1) % heroSlides.length;
          heroSlides[currentSlide].classList.add('active');
        }, 7000);
      }

      // --- Scroll animations ---
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

      document.querySelectorAll('.animate-in').forEach((el) => observer.observe(el));

      // --- Navbar scroll ---
      const navbar = document.getElementById('navbar');
      window.addEventListener('scroll', () => {
        navbar.classList.toggle('nav-scrolled', window.scrollY > 40);
      }, { passive: true });
    }

    loadPartials().then(initSite).catch((err) => console.error(err));
  </script>

</body>
</html>
