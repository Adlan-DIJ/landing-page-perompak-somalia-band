<!-- ===== CONTACT ===== -->
<section id="contact" class="section">
  <div class="container">
    <div class="grid lg:grid-cols-2 gap-12 lg:gap-20">
      <!-- Info -->
      <div class="animate-in">
        <p class="section-label">Contact</p>
        <h2 class="section-title">Let's <span class="text-[#666]">Connect</span></h2>
        <p class="section-subtitle mb-10">Have questions? Want to collaborate? Or just want to talk about music? We'd love to hear from you.</p>
        <div class="flex flex-col gap-6">
          <div class="flex items-center gap-4">
            <div class="w-11 h-11 rounded-full bg-[#1a1a1a] border border-[#222] flex items-center justify-center shrink-0">
              <svg class="w-[18px] h-[18px] text-[#888]" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            </div>
            <div>
              <p class="text-[12px] text-[#666]">Email</p>
              <p class="text-sm text-white">hello@noirmusic.com</p>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <div class="w-11 h-11 rounded-full bg-[#1a1a1a] border border-[#222] flex items-center justify-center shrink-0">
              <svg class="w-[18px] h-[18px] text-[#888]" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </div>
            <div>
              <p class="text-[12px] text-[#666]">Location</p>
              <p class="text-sm text-white">Jakarta, Indonesia</p>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <div class="w-11 h-11 rounded-full bg-[#1a1a1a] border border-[#222] flex items-center justify-center shrink-0">
              <svg class="w-[18px] h-[18px] text-[#888]" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
            </div>
            <div>
              <p class="text-[12px] text-[#666]">Phone</p>
              <p class="text-sm text-white">+62 123 456 789</p>
            </div>
          </div>
        </div>
      </div>
      <!-- Form -->
      <div class="animate-in">
        <form class="bg-[#161616] border border-[#222] rounded-2xl p-6 sm:p-8 space-y-5" onsubmit="return false;">
          <div class="grid sm:grid-cols-2 gap-5">
            <div>
              <label class="block text-[12px] text-[#666] mb-2">Name</label>
              <input type="text" class="w-full px-4 py-3 bg-[#0a0a0a] border border-[#222] rounded-xl text-sm text-white placeholder:text-[#444] focus:outline-none focus:border-[#555] transition-colors">
            </div>
            <div>
              <label class="block text-[12px] text-[#666] mb-2">Email</label>
              <input type="email" class="w-full px-4 py-3 bg-[#0a0a0a] border border-[#222] rounded-xl text-sm text-white placeholder:text-[#444] focus:outline-none focus:border-[#555] transition-colors">
            </div>
          </div>
          <div>
            <label class="block text-[12px] text-[#666] mb-2">Subject</label>
            <input type="text" class="w-full px-4 py-3 bg-[#0a0a0a] border border-[#222] rounded-xl text-sm text-white placeholder:text-[#444] focus:outline-none focus:border-[#555] transition-colors">
          </div>
          <div>
            <label class="block text-[12px] text-[#666] mb-2">Message</label>
            <textarea rows="4" class="w-full px-4 py-3 bg-[#0a0a0a] border border-[#222] rounded-xl text-sm text-white placeholder:text-[#444] focus:outline-none focus:border-[#555] transition-colors resize-none"></textarea>
          </div>
          <button type="submit" class="btn-primary w-full">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</section>
